{% extends 'base.html' %}

{% block title %}Вхід{% endblock %}

{% block content %}
<div class="card" style="max-width: 520px; margin: 40px auto;">
    <h2>Вхід</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
            <div>
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div style="color: #b91c1c; font-size: 0.9rem;">{{ field.errors }}</div>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit">Увійти</button>
    </form>
</div>
{% endblock %}
